<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            width: 850px;
            height: 450px;
            border: solid 2px brown;
            background-color: blueviolet;
            display: flex;
            margin: 5px;
            padding: 5px;
            flex-direction: row;
        }

        .box1{
            width: 400px;
            height: 400px;
            border: solid 2px yellow;
            background-color: yellow;
            margin: 5px;
            padding: 5px;
        }
        .box{
            width: 400px;
            height: 400px;
            border: solid 2px gray;
            background-color: gray;
            margin: 5px;
            padding: 5px;
        }
         img{
            width: 400px;
            height: 400px;
         }
         @media (max-width:640px) {
             .container{
            flex-direction: column;
            height: 900px;
             }
         }
    </style>
</head>
<body>

    <div class="container">
        <div class="box1" id="box1">
            <p>text1</p>
            <p>text2</p>
        </div>
        <div class="box" id="box2">
            <img src="image1.png" alt="pta">
        </div>
    </div>
    
</body>
</html>
