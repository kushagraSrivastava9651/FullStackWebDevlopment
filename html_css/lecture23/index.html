<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
     .container{
        width:100vw;
        height:100vh;
        background-color: aquamarine;
        border: 3px solid gray;
    }
    .box{
        height: 80px;
        width: 200px;
        border: 2px solid green;
        background-color: yellow;
        margin: 2px;
        position: relative;
        border-radius: 12px;
       animation-name: rightMovement;
        /*  animation-duration: 5s;
        animation-iteration-count: 1;
        animation-delay: 2s;
        animation-timing-function: linear;

        /* animation-direction: alternate; */
        /* animation-fill-mode: forwards; */

        /* @keyframes duration | easing-function | delay |
iteration-count | direction | fill-mode | play-state | name */
animation: 3s linear 1s infinite alternate none running rightMovement;
    }

      #box2{
        height: 80px;
        width: 200px;
        border: 2px solid green;
        background-color: yellow;
        margin: 2px;
        position: relative;
        border-radius: 12px;
        animation-name: leftMovement;
        /*  animation-duration: 5s;
        animation-iteration-count: 1;
        animation-delay: 2s;
        animation-timing-function: linear;

        /* animation-direction: alternate; */
        /* animation-fill-mode: forwards; */

        /* @keyframes duration | easing-function | delay |
iteration-count | direction | fill-mode | play-state | name */
animation: 3s linear 1s infinite alternate none running leftMovement;
    }

    @keyframes rightMovement {
        from{
          top:0;
          left:0;
        }
        to{
            top :0;
            left: 1200px;
        }
    }
    @keyframes leftMovement {
        from{
          top:300px;
          left:1200px;
        }
        to{
            top :300px;
            left: 0px;
        }
    }
    </style>
   
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
    <div id="box2">

    </div>
</body>
</html>
