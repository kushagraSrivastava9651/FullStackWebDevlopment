<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <style>
        *{
    padding: 0;
    margin: 0;

        }
        .container{
            width: 100vw;
            height: 100vh;
            background: linear-gradient(90deg, #0061FF, #60EFFF);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            width: 400px;
            height: 600px;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            margin: 30px;
            align-items: center;
        }
       .card img{
            width: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            font-size: 1.2rem;
            
        }
        .card h1{
            padding: 10px;
            font-size: 1.8rem;
        }

         .card p{
            padding: 10px;
            font-size: 1.3rem;
        }

    </style>
</head>
<body>
    <div class="container">

        <div class="card">
            <img src="image.png" alt="">
            <h1>Lorem ipsum dolor sit amet</h1>
            <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Cum distinctio dignissimos cupiditate rerum esse illum ratione perferendis voluptates repudiandae labore! Sapiente quidem ex rerum, corrupti at voluptatibus! Aspernatur, ipsa libero.</p>

        </div>

    </div>
</body>
</html>
