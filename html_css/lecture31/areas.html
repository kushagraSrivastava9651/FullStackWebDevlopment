<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Template Area</title>
    <style>
                *{
            padding: 0px;
            margin: 0px;
        }
        body{
            width: 100%;
            height: 100%;
        }
        .container{
            height: 100%;
            width: 100%;
            padding: 4rem;
            display: grid;
            gap: 1rem;
            background-color: black;
            grid-template-areas:
            "header header header"
            "sidebar content1 content1"
            "sidebar content2 content3"
            "footer footer footer"
     
        }
        .item{

            border: black 2px solid;
            background-color: blue;
            color: white;
            padding: 1rem;
        }
        #header{
  grid-area: header;
        }
        #content1{
  grid-area: content1;
        }
        #content2{
  grid-area: content2;
        }
        #content3{
  grid-area: content3;
        }
        #sidebar{
  grid-area: sidebar;
        }
        #footer{
  grid-area: footer;
        }
    </style>
</head>
<body>
    <div class="container">
       <div class="item" id="header">header</div>
       <div class="item" id="sidebar">sidebar</div>
       <div class="item" id="content1">Content1</div>
       <div class="item" id="content2">content2</div>
       <div class="item" id="content3">content3</div>
       <div class="item" id="footer">Footer</div>
    
    </div>
</body>
</html>
