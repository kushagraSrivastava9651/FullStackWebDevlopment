<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>

 
        <label for="name">Enter Name</label>
        <input type="text" id="name">

        <br>
        <br>

        <label for="submit">Button:</label>
       <input type="button" name="submit" id="submit" value="Subscribe">

       <label for="cars">Choose a car:</label>

        <select name="cars" id="cars">
        <option value="volvo">Volvo</option>
        <option value="saab">Saab</option>
        <option value="mercedes">Mercedes</option>
        <option value="audi">Audi</option>
        </select>

  <fieldset>
    <legend>Please select your preferred contact method:</legend>
    <div>
      <input type="radio" id="contactChoice1" name="contact" value="email" />
      <label for="contactChoice1">Email</label>

      <input type="radio" id="contactChoice2" name="contact" value="phone" />
      <label for="contactChoice2">Phone</label>

      <input type="radio" id="contactChoice3" name="contact" value="mail" />
      <label for="contactChoice3">Mail</label>
    </div>
    <div>
      <button type="submit">Submit</button>
    </div>
  </fieldset>
  <br>
  <br>

  <label for="filenamechoose">select file</label>
  <input type="file" id="filenamechoose">
  <br>  <br>
  <br>  <br>
  <label for="password">Password</label>
  <input type="password" placeholder="enter pss.." id="password">

  <br>

  <label for="datepicker">select date</label>
  <input type="date" id="datepicker">
  <br>
  <input
  type="image"
  id="image"
  alt="download"
  src="download-icon-for-web-app-logo-ui-vector-27559318.png"
  width="20px"
  height="20px" />

</form>
</body>
</html>
