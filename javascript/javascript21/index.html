<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetMetric</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h1>LeetMetrics</h1>
        <div class="user-container">
            <p>Enter your username below:</p>
            <div class="user-input-container">
                <input type="text" placeholder="enterusername" id="user-input">
                <button id="search-button"> Search</button>
            </div>

        </div>



        <div class="stats-container">

            <div class="progress-container">
                <div class="progress-item"> 
                    <div class="easy-progress circle">
                        <span id="Easy-label"></span>
                        Easy
                    </div>
                </div>
               
                <div class="progress-item">
                     <div class="medium-progress circle">
                        <span id="Medium-label"></span>
                        Medium
                    </div>
                </div>

                 <div class="progress-item">
                     <div class="hard-progress circle">
                        <span id="Hard-label"></span>
                        Hard
                    </div>
                </div>

                <div class="stats-card"></div>
            </div>
        </div>
          
    </div>

    <script src="index.js"></script>
</body>
</html>
